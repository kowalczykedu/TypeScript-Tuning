<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <radialGradient id="intakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E00FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AE05C6"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#2B292E"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#363439"/>
      <stop offset="50%" stop-color="#9A8CA2"/>
      <stop offset="100%" stop-color="#141317"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="12" fill="#0F0E17"/>
  <circle cx="160" cy="120" r="100" fill="url(#intakeGlow)"/>
  <!-- Mandrel Bent Intake Tube -->
  <path d="M70 150 C70 100 130 70 200 70 L240 70" stroke="url(#pipeGrad)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Silicone Coupler -->
  <rect x="225" y="52" width="25" height="36" rx="4" fill="#9E00FF" stroke="#FBABFF" stroke-width="2"/>
  <!-- Conical Air Filter -->
  <path d="M50 115 L120 85 L120 195 L50 165 Z" fill="url(#coneGrad)" stroke="#FBABFF" stroke-width="3"/>
  <!-- Filter Pleats (Grooves) -->
  <line x1="60" y1="110" x2="60" y2="170" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="75" y1="104" x2="75" y2="176" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="90" y1="98" x2="90" y2="182" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="105" y1="92" x2="105" y2="188" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <!-- Filter End Cap -->
  <ellipse cx="48" cy="140" rx="8" ry="25" fill="#201F24" stroke="#9A8CA2" stroke-width="2"/>
  <circle cx="48" cy="140" r="6" fill="#9E00FF"/>
  <text x="16" y="222" fill="#9E00FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">COLD AIR ADMISSION</text>
  <text x="245" y="222" fill="#9A8CA2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INTAKE</text>
</svg>
