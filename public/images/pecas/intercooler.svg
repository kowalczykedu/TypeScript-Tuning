<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <radialGradient id="icGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#363439"/>
      <stop offset="50%" stop-color="#201F24"/>
      <stop offset="100%" stop-color="#141317"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="12" fill="#0F0E17"/>
  <circle cx="160" cy="120" r="100" fill="url(#icGlow)"/>
  <!-- Intercooler Core -->
  <rect x="70" y="70" width="180" height="90" rx="4" fill="url(#coreGrad)" stroke="#9E00FF" stroke-width="2"/>
  <!-- Cooling Fins Matrix -->
  <line x1="70" y1="85" x2="250" y2="85" stroke="#4E4356" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="70" y1="100" x2="250" y2="100" stroke="#4E4356" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="70" y1="115" x2="250" y2="115" stroke="#9E00FF" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="70" y1="130" x2="250" y2="130" stroke="#4E4356" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="70" y1="145" x2="250" y2="145" stroke="#4E4356" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- End Tanks (Cast Aluminum) -->
  <path d="M70 70 L40 90 L40 140 L70 160 Z" fill="#1C1B20" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="35" cy="115" r="12" fill="#0F0D12" stroke="#9E00FF" stroke-width="3"/>
  <path d="M250 70 L280 90 L280 140 L250 160 Z" fill="#1C1B20" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="285" cy="115" r="12" fill="#0F0D12" stroke="#FBABFF" stroke-width="3"/>
  <!-- Mounting Brackets -->
  <rect x="110" y="55" width="20" height="15" rx="2" fill="#363439" stroke="#9A8CA2" stroke-width="1"/>
  <circle cx="120" cy="62" r="3" fill="#08070B"/>
  <rect x="190" y="55" width="20" height="15" rx="2" fill="#363439" stroke="#9A8CA2" stroke-width="1"/>
  <circle cx="200" cy="62" r="3" fill="#08070B"/>
  <text x="16" y="222" fill="#9E00FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">CHARGE AIR COOLER</text>
  <text x="210" y="222" fill="#9A8CA2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INTERCOOLER</text>
</svg>
