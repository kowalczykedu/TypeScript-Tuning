<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <radialGradient id="oilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F0E17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="240" rx="12" fill="#0F0E17"/>
  <circle cx="160" cy="120" r="100" fill="url(#oilGlow)"/>
  <!-- Multi-Row Compact Matrix -->
  <rect x="95" y="65" width="130" height="95" rx="4" fill="#1C1B20" stroke="#9E00FF" stroke-width="2"/>
  <!-- 8 Oil Rows -->
  <line x1="95" y1="78" x2="225" y2="78" stroke="#FBABFF" stroke-width="3"/>
  <line x1="95" y1="90" x2="225" y2="90" stroke="#FBABFF" stroke-width="3"/>
  <line x1="95" y1="102" x2="225" y2="102" stroke="#FBABFF" stroke-width="3"/>
  <line x1="95" y1="114" x2="225" y2="114" stroke="#FBABFF" stroke-width="3"/>
  <line x1="95" y1="126" x2="225" y2="126" stroke="#FBABFF" stroke-width="3"/>
  <line x1="95" y1="138" x2="225" y2="138" stroke="#FBABFF" stroke-width="3"/>
  <line x1="95" y1="150" x2="225" y2="150" stroke="#FBABFF" stroke-width="3"/>
  <!-- AN-10 Billet Fittings on Top -->
  <rect x="110" y="45" width="18" height="20" rx="2" fill="#201F24" stroke="#9E00FF" stroke-width="2"/>
  <circle cx="119" cy="45" r="5" fill="#08070B" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="192" y="45" width="18" height="20" rx="2" fill="#201F24" stroke="#FBABFF" stroke-width="2"/>
  <circle cx="201" cy="45" r="5" fill="#08070B" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Side Mounting Brackets -->
  <path d="M85 85 L95 85 L95 140 L85 140 Z" fill="#2B292E" stroke="#9A8CA2" stroke-width="1"/>
  <path d="M225 85 L235 85 L235 140 L225 140 Z" fill="#2B292E" stroke="#9A8CA2" stroke-width="1"/>
  <text x="16" y="222" fill="#9E00FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">LUBRICATION THERMAL MAP</text>
  <text x="210" y="222" fill="#9A8CA2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RAD. ÓLEO</text>
</svg>
