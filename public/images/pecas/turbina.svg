  </defs>
  <rect width="320" height="240" rx="12" fill="#0F0E17"/>
  <circle cx="160" cy="120" r="100" fill="url(#bgGlow)"/>
  <!-- Turbo Compressor Volute -->
  <path d="M160 50 C210 50 250 85 250 130 C250 175 210 200 165 200 C120 200 80 165 80 120 C80 80 115 50 160 50 Z" stroke="url(#metalGrad)" stroke-width="6" fill="#181622"/>
  <!-- Compressor Snout / Inlet -->
  <circle cx="160" cy="125" r="45" stroke="url(#neonViolet)" stroke-width="4" fill="#141317"/>
  <circle cx="160" cy="125" r="30" stroke="#9A8CA2" stroke-width="2" fill="#08070B"/>
  <!-- Impeller Blades -->
  <path d="M160 125 L160 98" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 125 L183 108" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 125 L186 132" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 125 L168 153" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 125 L142 150" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 125 L134 128" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 125 L140 106" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="160" cy="125" r="8" fill="#FFFFFF"/>
  <!-- Turbo Discharge Outlet -->
  <path d="M220 70 L265 40 L280 65 L235 95 Z" fill="#201F24" stroke="url(#metalGrad)" stroke-width="3"/>
  <!-- Actuator Wastegate -->
  <rect x="55" y="80" width="30" height="45" rx="6" fill="#201F24" stroke="url(#neonViolet)" stroke-width="2"/>
  <line x1="85" y1="102" x2="120" y2="102" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="16" y="222" fill="#9E00FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">STAGE FORCED INDUCTION</text>
  <text x="250" y="222" fill="#9A8CA2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TURBO</text>
</svg>
