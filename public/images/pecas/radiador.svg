<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <radialGradient id="radGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="radMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#363439"/>
      <stop offset="50%" stop-color="#201F24"/>
      <stop offset="100%" stop-color="#0F0D12"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="12" fill="#0F0E17"/>
  <circle cx="160" cy="120" r="100" fill="url(#radGlow)"/>
  <!-- Radiator Frame & Top Tank -->
  <rect x="75" y="60" width="170" height="20" rx="4" fill="#2B292E" stroke="#FBABFF" stroke-width="2"/>
  <!-- Radiator Cap -->
  <rect x="210" y="50" width="22" height="10" rx="2" fill="#9E00FF" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Radiator Fin Matrix Core -->
  <rect x="75" y="80" width="170" height="85" fill="url(#radMetal)" stroke="#9A8CA2" stroke-width="2"/>
  <!-- Vertical Coolant Tubes -->
  <line x1="95" y1="80" x2="95" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="115" y1="80" x2="115" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="135" y1="80" x2="135" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="155" y1="80" x2="155" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="175" y1="80" x2="175" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="195" y1="80" x2="195" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="215" y1="80" x2="215" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="235" y1="80" x2="235" y2="165" stroke="#9E00FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Bottom Tank -->
  <rect x="75" y="165" width="170" height="18" rx="4" fill="#2B292E" stroke="#FBABFF" stroke-width="2"/>
  <!-- Inlet & Outlet Hoses -->
  <circle cx="85" cy="70" r="8" fill="#141317" stroke="#9E00FF" stroke-width="2"/>
  <circle cx="235" cy="174" r="8" fill="#141317" stroke="#FBABFF" stroke-width="2"/>
  <text x="16" y="222" fill="#9E00FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">ALUMINUM HEAT DISSIPATION</text>
  <text x="235" y="222" fill="#9A8CA2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RADIADOR</text>
</svg>
